# labels 設定：push 到 main 後，由 .github/workflows/labels.yml 自動同步到 GitHub。
# 新增或修改 label 請改這個檔案，不要直接在網頁上改。

# ===== 影響範圍 =====
- name: "app:planner"
  color: "1D76DB"
  description: "planner：任務進度、出發前清單、鑰匙、藏身處"
- name: "app:client"
  color: "0E8A16"
  description: "client：本機中樞、讀取 log 與截圖座標"
- name: "app:map"
  color: "5319E7"
  description: "map：位置、任務點、路線與標記"
- name: "app:server"
  color: "B60205"
  description: "server：小隊中繼站"
- name: "pkg:protocol"
  color: "C5DEF5"
  description: "protocol：事件與資料格式規格"
- name: "pkg:game-data"
  color: "BFDADC"
  description: "game-data：地圖、任務、物品等遊戲資料"

# ===== 類型 =====
- name: "type:goal"
  color: "3E4B9E"
  description: "目標：由多個子 issue 組成，不直接交給 Claude 開發"
- name: "type:feature"
  color: "A2EEEF"
  description: "新增或改善功能"
- name: "type:bug"
  color: "D73A4A"
  description: "不正常的行為"
- name: "type:experiment"
  color: "FBCA04"
  description: "開發前的驗證實驗"
- name: "type:chore"
  color: "EDEDED"
  description: "建置、設定、重構等非功能性工作"
- name: "type:docs"
  color: "0075CA"
  description: "文件"

# ===== 狀態（每個子 issue 同時只有一個，見 docs/workflow.md 第 2 節）=====
- name: "status:ready"
  color: "0E8A16"
  description: "規格完成，可以交給 Claude 開發（使用者加上）"
- name: "status:in-progress"
  color: "FBCA04"
  description: "Claude 開發中（Claude 加上）"
- name: "status:review"
  color: "8250DF"
  description: "已回報，等待使用者審核（Claude 加上）"
- name: "status:changes-requested"
  color: "E99695"
  description: "使用者退回，需要修改（使用者加上）"
- name: "status:blocked"
  color: "000000"
  description: "依賴未完成或需要使用者決定，見留言說明"
- name: "status:paused"
  color: "CCCCCC"
  description: "暫停中（例如 map、server）"
