name: 關閉已合併的子 issue

# GitHub 只在 PR 合併到預設分支（main）時自動關閉 `Closes #N` 的 issue。
# 子 issue 的 PR 合併到目標的 dev 分支時，由這個工作流程補上關閉的動作。
# 關閉時一併移除 status:* 標籤：issue 已關閉就代表完成，不再需要狀態標籤。

on:
  pull_request:
    types: [closed]
    branches:
      - "dev/**"

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    name: 關閉 PR 內容中 Closes 的 issue
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(pattern)].map((m) => Number(m[1])))];

            if (numbers.length === 0) {
              core.info("PR 內容沒有 Closes #N，不需要關閉 issue");
              return;
            }

            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === "closed") {
                continue;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `✅ 已由 #${pr.number} 合併到 \`${pr.base.ref}\`，自動關閉。`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`已關閉 #${issue_number}`);

              const statusLabels = issue.labels
                .map((label) => (typeof label === "string" ? label : label.name))
                .filter((name) => name && name.startsWith("status:"));
              for (const name of statusLabels) {
                try {
                  await github.rest.issues.removeLabel({ ...context.repo, issue_number, name });
                  core.info(`已移除 #${issue_number} 的 ${name}`);
                } catch (error) {
                  // 讀取 issue 之後標籤可能已被移除，這種情況不算失敗
                  if (error.status !== 404) {
                    throw error;
                  }
                  core.info(`#${issue_number} 已經沒有 ${name}，略過`);
                }
              }
            }
