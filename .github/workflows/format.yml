name: 格式檢查

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  editorconfig:
    name: 檢查檔案格式（.editorconfig）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 此 action 沒有 v3 的簡寫 tag，必須寫完整版本
      - uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
      - run: editorconfig-checker
