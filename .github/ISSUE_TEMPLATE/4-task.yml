name: 🔧 工作項目
description: 建置、設定、重構、文件等非功能性的工作
title: "[工作] "
labels: ["type:chore"]
body:
  - type: input
    id: parent
    attributes:
      label: 上層目標
      description: 這個 issue 屬於哪個目標 issue？**要交給 Claude 開發就必須填寫**：Claude 會從目標讀取背景與開發分支（dev 分支），PR 也會合併到那裡。
      placeholder: "#10"
  - type: input
    id: depends
    attributes:
      label: 依賴
      description: 必須先完成（已關閉）的 issue，用逗號分隔。依賴未完成時 Claude 不會開始開發。沒有可以留空。
      placeholder: "#11, #12"
  - type: dropdown
    id: kind
    attributes:
      label: 工作性質
      description: 補充 type:* label，說明這項工作的細部方向；Claude 依此選擇分支與 commit 的類型。
      options:
        - 建置與設定（chore）
        - CI／自動化（chore）
        - 相依套件（chore）
        - 測試（test）
        - 重構（refactor）
        - 文件（docs）
        - 其他（chore）
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影響範圍
      multiple: true
      options:
        - 整個 repo
        - planner
        - client
        - map
        - server
        - protocol
        - game-data
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 要做什麼
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完成條件
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 不做的範圍
      description: 明確列出這個 issue 不處理的事。
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 相關文件
      description: 決策紀錄、架構章節、相關 issue。開發者看不到事前討論，請附上所有需要的連結。
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 驗證方式
      description: 要執行哪些指令或檢查？
    validations:
      required: true
